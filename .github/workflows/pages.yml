name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Detector / analyzer simulation
        run: node test/sim.mjs
      - name: Inbox (video upload) server
        run: node test/inbox.mjs
      - name: Power saving (rate governor)
        run: node test/power.mjs
      - name: Edition split (public vs local)
        run: node test/editions.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: "Stage site (public edition only: no tests, no local server, no js/local)"
        run: |
          mkdir _site
          cp -R index.html style.css manifest.webmanifest js _site/
          rm -rf _site/js/local
      - name: "Stamp build id (new URLs per deploy: Pages caches files for 10 min, so old and new files must not mix)"
        run: |
          V=${GITHUB_SHA::7}
          sed -i -E "s#(from '\./[^']+\.js)'#\1?v=$V'#" _site/js/*.js
          sed -i -E "s#href=\"style\.css\"#href=\"style.css?v=$V\"#; s#src=\"js/main\.js\"#src=\"js/main.js?v=$V\"#; s#>開発中<#>$V<#" _site/index.html
          grep -c "?v=$V" _site/index.html _site/js/main.js
      - name: Verify the staged site is the public edition
        run: node test/editions.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
